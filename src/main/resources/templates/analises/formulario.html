<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Casa Cultural</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body>

    <!-- Faixa com imagem -->
    <header>
        <img src="/image/casacultural.jpeg" class="img-fluid w-100" alt="Casa Cultural" />
    </header>

    <!-- Menu fixo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🎥 Casa Cultural</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/filmes">Filmes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/filmes/novo">Cadastrar Filme</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container mt-4" th:insert="~{::section}"></main>

    <!-- Rodapé com imagem -->
    <footer class="bg-light text-center mt-5 p-3">
        <img src="/image/rodape.jpeg" class="img-fluid" alt="Rodapé">
        <p class="mt-2">© 2025 Casa Cultural - Todos os direitos reservados</p>
    </footer>

    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
