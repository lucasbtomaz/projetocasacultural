<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
    <head>
        <meta charset="UTF-8">
        <title>Avaliar Filme</title>
        <link rel="stylesheet" href="/css/bootstrap.min.css">
        <link rel="stylesheet" href="/css/detalhes.css">
    </head>
    <body class="bg-light">

        <section class="container mt-5">
            <h1 class="mb-4">📝 Avaliar: <span th:text="${filme.titulo}"></span></h1>

            <form th:action="@{/filmes/salvar-analise}" method="post">
                <!-- Campo oculto com o ID do filme -->
                <input type="hidden" name="filme.id" th:value="${filme.id}" />

                <div class="mb-3">
                    <label for="analise" class="form-label">Comentário:</label>
                    <textarea class="form-control" id="analise" name="analise" rows="4" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="nota" class="form-label">Nota (0 a 10):</label>
                    <input type="number" class="form-control" id="nota" name="nota" min="0" max="10" required>
                </div>

                <button type="submit" class="btn btn-primary">Salvar Análise</button>
                <a href="/filmes/lista" class="btn btn-secondary">Voltar</a>
            </form>
        </section>
        <!-- Bootstrap JS -->
        <script src="/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
