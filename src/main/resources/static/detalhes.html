<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
    <head>
        <meta charset="UTF-8">
        <title th:text="'Detalhes de ' + ${filme.titulo}">Detalhes do Filme</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- DataTables -->
        <link rel="stylesheet" href="https://cdn.datatables.net/1.10.24/css/jquery.dataTables.min.css">
        <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
        <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>

        <!-- Bootstrap -->
        <link rel="stylesheet" href="/css/bootstrap.min.css">

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" crossorigin="anonymous" />

        <!-- Arquivo de estilos da análise -->
        <link rel="stylesheet" href="/css/detalhes.css">
    </head>
    <body class="bg-light">

        <div class="container mt-5">
            <h1 class="mb-3" th:text="${filme.titulo}"></h1>
            <div class="mb-4">
                <p><strong>Sinopse:</strong> <span th:text="${filme.sinopse}"></span></p>
                <p><strong>Gênero:</strong> <span th:text="${filme.genero}"></span></p>
                <p><strong>Ano:</strong> <span th:text="${filme.anoLancamento}"></span></p>
            </div>

            <h4 class="mt-4">Média de avaliações: 
                <span th:text="${#numbers.formatDecimal(media, 1, 1)}">0.0</span>
            </h4>
            <div>
                <span th:each="i : ${#numbers.sequence(1,5)}">
                    <i class="fa fa-star" th:classappend="${i <= media} ? ' checked' : ''"></i>
                </span>
            </div>

            <h2 class="mt-5">Análises</h2>
            <table id="tabelaAnalises" class="display table table-bordered">
                <thead>
                    <tr>
                        <th>Comentário</th>
                        <th>Nota</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${filme.analises}">
                        <td th:text="${a.analise}"></td>
                        <td th:text="${a.nota}"></td>
                    </tr>
                </tbody>
            </table>
            
            <div class="mt-4 text-center">
                <a href="/filmes/lista" class="btn btn-secondary">Voltar para Lista</a>
            </div>

            <!-- Scripts -->
            <script src="/js/bootstrap.bundle.min.js"></script>
            <script>
                $(document).ready(function () {
                $('#tabelaAnalises').DataTable();
                });
            </script>
    </body>
</html>
