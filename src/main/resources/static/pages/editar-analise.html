<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Editar Análise</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">✏️ Editar Análise</h1>

        <form id="formEditarAnalise">
            <input type="hidden" id="analiseId">
            <input type="hidden" id="filmeId">

            <div class="mb-3">
                <label for="analise" class="form-label">Comentário</label>
                <textarea class="form-control" id="analise" required></textarea>
            </div>

            <div class="mb-3">
                <label for="nota" class="form-label">Nota (0 a 10)</label>
                <input type="number" class="form-control" id="nota" min="0" max="10" required>
            </div>

            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="#" class="btn btn-secondary" id="btnCancelar">Cancelar</a>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/editar-analise.js"></script>
</body>
</html>
