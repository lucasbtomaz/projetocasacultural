<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <title>Avaliar Filme</title>
        <link rel="stylesheet" href="/css/bootstrap.min.css">
        <link rel="stylesheet" href="/css/detalhes.css">
    </head>
    <body class="bg-light">

        <section class="container mt-5">
            <h1 class="mb-4">📝 Avaliar: <span id="titulo-filme"></span></h1>

            <form id="formAvaliacao">
                <!-- Campo oculto com o ID do filme -->
                <input type="hidden" id="filmeId" />

                <div class="mb-3">
                    <label for="analise" class="form-label">Comentário:</label>
                    <textarea class="form-control" id="analise" name="analise" rows="4" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="nota" class="form-label">Nota (0 a 10):</label>
                    <input type="number" class="form-control" id="nota" name="nota" min="0" max="10" required>
                </div>

                <button type="submit" class="btn btn-primary">Salvar Análise</button>
                <a href="/pages/lista.html" class="btn btn-secondary">Voltar</a>
            </form>
        </section>

        <!-- Bootstrap JS -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="/js/bootstrap.bundle.min.js"></script>
        <script src="/js/avaliar.js"></script>
    </body>
</html>
