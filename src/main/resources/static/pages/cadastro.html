<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <title>Cadastrar Filme</title>

        <link rel="stylesheet" href="/css/bootstrap.min.css">
        <link rel="stylesheet" href="/css/cadastro.css">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <h1 class="mb-4">Cadastrar Filme</h1>

            <form id="formCadastro" method="post" class="form-cadastro">
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" name="titulo" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Sinopse</label>
                    <input type="text" name="sinopse" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Gênero</label>
                    <input type="text" name="genero" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Ano de Lançamento</label>
                    <input type="number" name="anoLancamento" class="form-control" min="1900" required />
                </div>

                <button type="submit" class="btn btn-success">Cadastrar</button>
            </form>
                <a href="#" class="btn btn-secondary" id="btnVoltar">Voltar</a>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="/js/bootstrap.bundle.min.js"></script>
        <script src="/js/cadastro.js"></script>
    </body>
</html>
