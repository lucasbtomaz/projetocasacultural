<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Filme</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h1 id="titulo" class="mb-3"></h1>
        <p><strong>Sinopse:</strong> <span id="sinopse"></span></p>
        <p><strong>Gênero:</strong> <span id="genero"></span></p>
        <p><strong>Ano:</strong> <span id="anoLancamento"></span></p>

        <h4 class="mt-4">Média das avaliações:
            <span id="media">0.0</span>
            <div id="media-estrelas"></div>
        </h4>

        <h2 class="mt-5">Análises</h2>
        <table id="tabelaAnalises" class="display table table-bordered">
            <thead>
                <tr>
                    <th>Comentário</th>
                    <th>Nota</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="mt-4 text-center">
            <a href="/pages/lista.html" class="btn btn-secondary">Voltar para Lista</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/detalhes.js"></script>
</body>
</html>
