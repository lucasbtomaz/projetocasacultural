name: Feature para Dev

on:
  push:
    branches:
      - 'feature/**'

jobs:
  test-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Iniciar processo
        run: echo "Processo iniciado para ${{ github.ref_name }}"

      - name: Build e Testes com Maven
        run: mvn clean verify

      - name: Testes concluídos com sucesso
        run: echo "Todos os testes passaram!"

      - name: Criar PR para dev
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Merge automático da feature para dev'
          body: 'PR criado automaticamente após testes com sucesso.'
          base: dev
          branch: ${{ github.ref_name }}
          draft: false